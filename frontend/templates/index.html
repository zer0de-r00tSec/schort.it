<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>schort.it – URL Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
 <link rel="icon" href="/static/favicon.ico">
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">

  <!-- Nav -->
  <nav class="border-b border-zinc-800 px-6 py-4 flex items-center justify-between">
    <span class="font-bold text-lg tracking-tight">schort.it</span>
    <div class="flex gap-4 text-sm text-zinc-400">
      <a href="/linkus" class="hover:text-white transition-colors">Link-Us</a>
      <a href="/about" class="hover:text-white transition-colors">About</a>
      <a href="https://github.com/zer0de-r00tSec/schort.it" target="_blank" class="hover:text-white transition-colors">GitHub</a>
    </div>
  </nav>

  <!-- Main -->
  <main class="flex-1 flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-xl space-y-6">
      <div class="space-y-2">
        <h1 class="text-3xl font-bold tracking-tight">Shorten your URL.</h1>
        <p class="text-zinc-400 text-sm">Kein Tracking. Keine Werbung. Einfach kurze Links.</p>
      </div>

      <!-- Input -->
      <div class="flex gap-2">
        <input
          id="url-input"
          type="url"
          placeholder="https://deine-lange-url.com/irgendwas/langer/pfad"
          class="flex-1 bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder:text-zinc-500 text-white"
        />
        <button
          onclick="shortenUrl()"
          class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-lg text-sm font-medium transition-colors whitespace-nowrap">
          Shorten
        </button>
      </div>

      <!-- Error -->
      <p id="error-msg" class="hidden text-red-400 text-sm"></p>

      <!-- Result -->
      <div id="result-card" class="hidden bg-zinc-800 border border-zinc-700 rounded-lg p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs text-zinc-500 uppercase tracking-wide">Dein kurzer Link</span>
        </div>
        <div class="flex items-center justify-between gap-3">
          <a id="short-url" href="#" target="_blank" class="text-indigo-400 font-mono text-sm hover:underline truncate"></a>
          <button onclick="copyShort()" class="text-xs text-zinc-400 hover:text-white transition-colors whitespace-nowrap border border-zinc-600 rounded px-2 py-1">
            Copy
          </button>
        </div>
        <hr class="border-zinc-700" />
        <div class="flex items-center justify-between">
          <span class="text-xs text-zinc-500 uppercase tracking-wide">Admin Link</span>
        </div>
        <div class="flex items-center justify-between gap-3">
          <a id="admin-url" href="#" target="_blank" class="text-amber-400 font-mono text-sm hover:underline truncate"></a>
          <button onclick="copyAdmin()" class="text-xs text-zinc-400 hover:text-white transition-colors whitespace-nowrap border border-zinc-600 rounded px-2 py-1">
            Copy
          </button>
        </div>
        <p class="text-xs text-zinc-500">⚠️ Speichere den Admin Link – damit kannst du den Link später verwalten oder löschen.</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-800 px-6 py-4 text-center text-xs text-zinc-600">
    © 2026 schort.it – made with ❤️ by <a href="https://github.com/zer0de-r00tSec/schort.it" class="hover:text-zinc-400 transition-colors">zer0.de</a>
  </footer>

  <script>
    let _shortUrl = '';
    let _adminUrl = '';

    async function shortenUrl() {
      const input = document.getElementById('url-input');
      const errorMsg = document.getElementById('error-msg');
      const resultCard = document.getElementById('result-card');

      errorMsg.classList.add('hidden');
      resultCard.classList.add('hidden');

      const url = input.value.trim();
      if (!url) return;

      try {
        const res = await fetch('https://api.schort.it/url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target_url: url })
        });

        if (!res.ok) {
          const data = await res.json();
          errorMsg.textContent = data.detail || 'Fehler beim Kürzen.';
          errorMsg.classList.remove('hidden');
          return;
        }

		const data = await res.json();
		_shortUrl = data.url;
		_adminUrl = data.admin_url;
      
		document.getElementById('short-url').textContent = _shortUrl;
		document.getElementById('short-url').href = _shortUrl;
		document.getElementById('admin-url').textContent = _adminUrl;
		document.getElementById('admin-url').href = _adminUrl;
      
        resultCard.classList.remove('hidden');
        input.value = '';
      } catch (e) {
        errorMsg.textContent = 'Verbindungsfehler – ist die API erreichbar?';
        errorMsg.classList.remove('hidden');
      }
    }

    function copyShort() {
      navigator.clipboard.writeText(_shortUrl);
    }

    function copyAdmin() {
      navigator.clipboard.writeText(_adminUrl);
    }

    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') shortenUrl();
    });
  </script>
</body>
</html>
